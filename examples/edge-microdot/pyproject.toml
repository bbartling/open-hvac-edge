[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-microdot"
version = "0.1.0"
description = "Lightweight Microdot edge ingest for BACnet and Niagara on resource-constrained Pi hosts"
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "microdot==2.8.0",
    "duckdb==2.0.1",
    "tzdata==2026.6",
    "bacpypes3==0.1.0",
    "rdflib==7.6.0",
    "pyyaml==6.0.4",
    "msgpack==1.2.4",
    "websocket-client==1.9.2",
    "requests==2.34.2",
    "PyJWT==2.15.1",
    "pyoxigraph==0.5.13",
]

[project.optional-dependencies]
modbus = ["pymodbus==3.16.2"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "httpx==0.29.0"]

[project.scripts]
edge-microdot = "edge_microdot.cli:main"

[tool.setuptools.packages.find]
include = ["edge_microdot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"